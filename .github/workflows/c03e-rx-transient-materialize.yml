name: C03e-RX transient materializer

on:
  push:
    branches:
      - phase-152-c03e-rx-production-durable-post-auth-fallible-verifier-time-requester-rendezvous-expected-device-admission-async-producer-send-fallible-terminal-receipt-composition-source-materialization

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact selected source seam and self-remove
        shell: bash
        run: |
          set -euo pipefail
          BASE="01210b093ae73e6f0d2652bd6d23f2b6db9b1789"
          SOURCE="crates/prw-agent/src/remote_session_capability_runtime/remote_session_endpoint_lifecycle_runtime.rs"
          WORKFLOW=".github/workflows/c03e-rx-transient-materialize.yml"
          EXPECTED_BLOB="2c9f27105a1f67ab017ffbde4d369cee03f84d8c"
          HELPER_B64=""
          test "$(git hash-object "$SOURCE")" = "$EXPECTED_BLOB"
          python3 -c 'from pathlib import Path; import base64, sys; p=Path("crates/prw-agent/src/remote_session_capability_runtime/remote_session_endpoint_lifecycle_runtime.rs"); t=p.read_text(); target="produce_remote_session_expected_device_admission_with_fallible_verifier_time_and_fallible_receipt"; marker="\n/// Recoverable failed startup transaction retaining the exact admitted reachability authority.\n"; assert target not in t; assert t.count(marker)==1; helper=base64.b64decode(sys.argv[1]).decode(); p.write_text(t.replace(marker, "\n" + helper + marker, 1))' "$HELPER_B64"
          git diff --check
          git add "$SOURCE"
          git rm "$WORKFLOW"
          test "$(git diff --cached --name-only "$BASE" | wc -l)" -eq 1
          test "$(git diff --cached --name-only "$BASE")" = "$SOURCE"
          test "$(git diff --cached --numstat "$BASE" -- "$SOURCE" | awk '{print $2}')" = "0"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "C03e-RX: materialize fallible async producer terminal receipt composition"
          git push origin HEAD
